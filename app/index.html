<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook</title>
  <meta name="description" content="Your calendar, to-dos, tasks, reading list, habits, expenses and news in one place.">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('daybook.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <noscript>Daybook needs JavaScript to run.</noscript>
</body>
</html>
